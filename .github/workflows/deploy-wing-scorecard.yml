name: Deploy Wing Scorecard

on:
  push:
    branches: [main]
    paths:
      - 'wing-scorecard/**'
      - '.github/workflows/deploy-wing-scorecard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare site
        run: |
          mkdir -p _site/wing-scorecard
          cp wing-scorecard/index.html _site/wing-scorecard/index.html
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=wing-scorecard/"><title>Wing Scorecard</title><a href="wing-scorecard/">Open Wing Scorecard</a>' > _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
